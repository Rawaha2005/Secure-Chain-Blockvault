services:
  # =====================================================
  # BACKEND SERVICE (FastAPI Python Application)
  # =====================================================
  - type: web
    name: fyp-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: AES_KEY
        value: UQ0Nuj4RWMBd8eEwrP127SSfw2nueDtvSVYHksoIadA=
      - key: CORS_ORIGINS
        value: https://fyp-frontend.onrender.com,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.9

  # =====================================================
  # FRONTEND SERVICE (Vite/React Static SPA)
  # =====================================================
  - type: static
    name: fyp-frontend
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fyp-backend.onrender.com
      - key: VITE_API_URL
        value: https://fyp-backend.onrender.com
      - key: NODE_VERSION
        value: 20.x
